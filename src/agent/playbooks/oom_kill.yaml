id: oom_kill
title_fa: "پر شدن حافظه (RAM)"
category: resources
signals:
  - { kind: event_reason, match: "OOMKill", weight: 0.6 }
  - { kind: metric, field: memory.pctOfLimit, op: ">=", value: 90, weight: 0.3 }
  - { kind: applet_reason, match: "OOMKilled", weight: 0.3 }
  - { kind: log_regex, match: "JavaScript heap out of memory|Reached heap limit|MemoryError|Killed process|out of memory|Cannot allocate memory", weight: 0.4 }
  - { kind: health, status_in: [502, 503, 504, 0], weight: 0.1 }
causes_fa:
  - "برنامه بیشتر از حافظه‌ی پلن مصرف می‌کند (نشت حافظه یا ترافیک بالا)"
  - "پلن انتخاب‌شده برای این برنامه کوچک است"
checks_fa:
  - "رویداد OOMKilled در ساعت‌های اخیر"
  - "نمودار رم نزدیک سقف پلن و رو به افزایش"
fixes:
  - id: rollback_if_recent_deploy
    when: "app.lastDeployAgeMinutes < 180 && release.previousReady != null"
    tool: rollback_release
    args_template: { appName: "{{app.name}}" }
    title_fa: "برگشت به نسخه‌ی قبلی"
    why_fa: "مشکل بعد از آخرین انتشار شروع شده و نسخه‌ی قبلی سالم بود"
    priority: 1
  - id: restart
    tool: restart_app
    args_template: { appName: "{{app.name}}" }
    title_fa: "ری‌استارت برنامه"
    why_fa: "حافظه آزاد می‌شود؛ ولی راه‌حل موقت است"
    priority: 2
  - id: upgrade_plan
    tool: resize_app
    args_template: { appName: "{{app.name}}", planID: "{{plan.nextUp}}" }
    title_fa: "ارتقای پلن به {{plan.nextUpLabel}}"
    why_fa: "اگر مصرف واقعی برنامه بالاست، حافظه‌ی بیشتری لازم دارد"
    priority: 3
manual_steps_fa:
  - "اگر بعد از ری‌استارت دوباره تکرار شد، بخش‌هایی از کد را که داده را در حافظه نگه می‌دارند (کش، آرایه‌های بزرگ) بررسی کنید."
verify:
  - { kind: no_event, match: "OOMKill", withinMinutes: 5 }
  - { kind: health, status: 200 }
  - { kind: metric, field: memory.lastPctOfLimit, op: "<", value: 85 }
advice_fa: "اگر بعد از ری‌استارت دوباره تکرار شد، احتمالاً نشت حافظه در کد است؛ بخش‌هایی که داده را در حافظه نگه می‌دارند (کش، آرایه‌های بزرگ) را بررسی کنید."
