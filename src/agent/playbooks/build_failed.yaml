id: build_failed
title_fa: "ساخت (بیلد) نسخه‌ی جدید ناموفق بود"
category: build
signals:
  - { kind: release_state, match: "^FAILED$|TIMEDOUT|CANCELED", weight: 0.7 }
  - kind: build_log_regex
    match: "npm ERR!|ERR_PNPM|ERESOLVE|ModuleNotFoundError|No matching distribution|Could not find a version|error:|failed to solve|ENOSPC|Cannot find module|SyntaxError|Unexpected token|exit code|Build failed|composer|failReason"
    weight: 0.3
causes_fa:
  - "ساخت نسخه‌ی جدید با خطا متوقف شد؛ معمولاً به‌خاطر وابستگی نصب‌نشده، خطای نحوی در کد یا فایل تنظیمات، یا دستور build اشتباه"
checks_fa:
  - "وضعیت «ناموفق» (FAILED) برای آخرین انتشار"
  - "خط خطا در لاگ بیلد"
fixes: []
manual_steps_fa:
  - "خطای بیلد را که در شواهد آمده در پروژه برطرف کنید (مثلاً وابستگی جاافتاده را به package.json یا requirements.txt اضافه کنید یا JSON خراب را درست کنید)."
  - "بعد از اصلاح، دوباره منتشر کنید؛ تا آن موقع نسخه‌ی قبلی سالم در حال اجراست."
verify:
  - { kind: release_ready }
advice_fa: "انتشار ناموفق جای نسخه‌ی در حال اجرا را نمی‌گیرد؛ سایت با نسخه‌ی قبلی بالا می‌ماند."
